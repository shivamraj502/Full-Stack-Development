    { name: "Imphal", lat: 24.81, lon: 93.94 },           // Manipur

// 🔍 SEARCH FUNCTION ONLY
async function searchWeather() {

    let input = document.getElementById("cityInput").value.toLowerCase();

    let city = cities.find(c => c.name.toLowerCase() === input);

    if (!city) {
        document.getElementById("result").innerHTML = "❌ City not found";
        return;
    }

    let url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,wind_speed_10m`;

    try {
        let res = await fetch(url);
        let data = await res.json();

        document.getElementById("result").innerHTML =
            `City: ${city.name} <br>
             Temperature: ${data.current.temperature_2m}°C <br>
             Wind Speed: ${data.current.wind_speed_10m} km/h`;

    } catch (error) {
        console.log("Error:", error);
    }
}

</script>
