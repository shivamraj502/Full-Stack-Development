<!-- Day 3: CSS basics → selectors, colors, background, borders, text formatting.
👉 Task: Style Day 1’s “About Me” page. -->

<!DOCTYPE html>
<html>
    <head>
        <title>about me</title>
        <style>

            *{
                background-color: rgb(180, 97, 97);
            }

            h1{
                color:blue;
            }

            #c1{
                background-color: antiquewhite;
                color: green;
                text-align: center;
                text-decoration-line: underline;
                text-decoration-color: black;
                text-transform: uppercase;
                letter-spacing: 4px;
                text-shadow: 3px 3px 5px rgb(170, 136, 136);
                border: 5px solid black;
                border-radius: 10px;
            }

            .a1{
                color: red;
                background-color: gray;
                border-style: dotted ;
                border-color: white;
                border-radius: 4px;
            }


        </style>
    </head>
    <body>
        <h1 >i am shivam.</h1>
        <h1 id="c1">This is heading 1</h1>
        <h2 class="a1">This is heading 2</h2>
        <h3>This is heading 3</h3>
        <h4>This is heading 4</h4>
        <h5>This is heading 5</h5>
        <h6>This is heading 6</h6>
    </body>
</html>
