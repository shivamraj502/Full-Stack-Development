<!DOCTYPE html>
<html lang="en">
<head>          
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact form</title>
</head>
<body>
    <form style="background-color: rgb(213, 187, 187);width: 500px;border: 5px solid rgb(176, 132, 132);">
        <label style="color:rgb(45, 45, 192);">Name:</label><br>
        <input type ="text"><br>
        <label >USN:</label><br>
        <input type ="text"><br>
        <label >email:</label><br>
        <input type ="email"><br>
        <label >Password:</label><br>
        <input type ="password"><br>
        <label >contact:</label><br>
        <input type ="tel"><br>
        <label >linkedin:</label><br>
        <input type ="url"><br>

        <p>choose your checkbox.</p>
        <input type ="checkbox">
        <label >i have a bike</label><br>
        <input type ="checkbox">
        <label >i have a car</label><br>
        
        <p>choose radio options.</p>
        <input type ="radio" id="name" name = "bike">
        <label for ="name">i have simple bike.</label><br>
        <input type ="radio" id="new" name = "bike">
        <label for="new">i have new bike.</label><br>

        <label >date:</label><br>
        <input type ="datetime-local"><br>
        <label >reset:</label><br>
        <input type ="reset"><br>
        <label >submit:</label><br>
        <input type ="submit"><br>

        <h1 style="text-align: center;color: brown;">Thank you</h1>
    </form>
</body>
</html>
